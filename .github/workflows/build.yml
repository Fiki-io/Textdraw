name: Android Build & Release

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dkotlin.incremental=true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build Debug APK  (every push / PR)
  # ─────────────────────────────────────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Create .env file
        run: |
          cat > app/.env <<EOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          FIREBASE_APPCHECK_DEBUG_TOKEN=${{ secrets.FIREBASE_APPCHECK_DEBUG_TOKEN }}
          EOF

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --build-cache

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # ─────────────────────────────────────────────
  # JOB 2: Build Release APK  (on tag v*.*.*)
  # ─────────────────────────────────────────────
  build-release:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: false

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
          else
            # Fallback to bundled debug keystore if no release secret set
            cp debug.keystore "${{ github.workspace }}/my-upload-key.jks"
          fi
          echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV

      - name: Create .env file
        run: |
          cat > app/.env <<EOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          FIREBASE_APPCHECK_DEBUG_TOKEN=${{ secrets.FIREBASE_APPCHECK_DEBUG_TOKEN }}
          EOF

      - name: Build Signed Release APK
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD:   ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          STORE_PASS="${STORE_PASSWORD:-android}"
          KEY_PASS="${KEY_PASSWORD:-android}"
          ./gradlew assembleRelease \
            --no-daemon \
            --build-cache \
            -PKEYSTORE_PATH="${KEYSTORE_PATH}" \
            -PSTORE_PASSWORD="${STORE_PASS}" \
            -PKEY_PASSWORD="${KEY_PASS}"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "SA-MP TD Studio ${{ github.ref_name }}"
          body: |
            ## SA-MP TD Studio ${{ github.ref_name }}
            Professional SA-MP & Open.MP TextDraw Editor for Android

            ### Perubahan
            ${{ github.event.head_commit.message }}

            ### Download APK
            Unduh APK dari assets di bawah ini.
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 3: Unit Tests
  # ─────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Create .env file
        run: |
          cat > app/.env <<EOF
          GEMINI_API_KEY=
          FIREBASE_APPCHECK_DEBUG_TOKEN=
          EOF

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --build-cache

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 7
