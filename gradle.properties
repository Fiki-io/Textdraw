# Project-wide Gradle settings.
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ── JVM & memory ────────────────────────────────────────────────────────────
# Increased heap for large Kotlin/Compose builds
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# ── Parallelism ──────────────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.workers.max=4

# ── Gradle Build Cache (local + remote via GitHub Actions) ──────────────────
org.gradle.caching=true

# ── Configuration Cache — speeds up config phase on repeat builds ───────────
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# ── Kotlin ───────────────────────────────────────────────────────────────────
kotlin.code.style=official
# Run Kotlin compiler in-process to avoid daemon connection issues on CI
kotlin.compiler.execution.strategy=in-process
# Incremental annotation processing
kapt.incremental.apt=true
kapt.use.worker.api=true

# ── Android ──────────────────────────────────────────────────────────────────
# Namespaced R class — reduces compile time for multi-module projects
android.nonTransitiveRClass=true
# Disable Jetifier (not needed if no Support Library artifacts)
android.enableJetifier=false
# New resource optimizer
android.enableResourceOptimizations=true

# ── Google Services passthrough ──────────────────────────────────────────────
googleServices.missing.passthrough=true
